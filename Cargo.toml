[workspace]
resolver = "2"
members = [
    "crates/gonomad-proto",
    "crates/gonomad-core",
    "crates/gonomad-store",
    "crates/gonomad-policy",
]

# Crates added as milestones land (see plan.md):
#   M1: gonomad-core, gonomad-transport, gonomad-server
#   M2: gonomad-pty
#   M3: gonomad-fs, gonomad-search
#   M4: gonomad-git
#   M5: gonomad-agents, gonomad-notify
#   M6: gonomad-ffi

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/YashSensei/GoNomad"
homepage = "https://github.com/YashSensei/GoNomad"
authors = ["The GoNomad Contributors"]

[workspace.dependencies]
# --- Internal ---
gonomad-proto = { path = "crates/gonomad-proto", version = "0.0.1" }
gonomad-core = { path = "crates/gonomad-core", version = "0.0.1" }
gonomad-store = { path = "crates/gonomad-store", version = "0.0.1" }
gonomad-policy = { path = "crates/gonomad-policy", version = "0.0.1" }

# --- Serialization (ARCHITECTURE.md §10.3: CBOR for control frames) ---
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
serde_json = "1.0"

# --- Error handling ---
thiserror = "2.0"
anyhow = "1.0"

# --- Crypto (ARCHITECTURE.md §3) ---
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
# Noise IK session layer. Layered inside QUIC deliberately, so that security is
# independent of transport and adding a tunnel fallback cannot weaken it (§3.4).
snow = "0.9"
# Crockford base32 for the manual pairing code: no ambiguous 0/O or 1/I/l, which
# matters when a human is reading digits off a laptop screen (§9.3).
data-encoding = "2.6"

# --- Storage (ARCHITECTURE.md §16.1: bundled SQLite, no system dep) ---
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

# --- Async ---
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# --- Observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Filesystem (ARCHITECTURE.md §18.1) ---
camino = "1.1"
dunce = "1.0"

# --- Utilities ---
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
globset = "0.4"

# --- Dev / test ---
proptest = "1.5"
tempfile = "3.13"
insta = { version = "1.40", features = ["yaml"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
# Reproducible, small, fast. See ARCHITECTURE.md §24.12.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-debug]
# Release speed with symbols, for profiling.
inherits = "release"
strip = "none"
debug = 1
panic = "unwind"

[profile.bench]
inherits = "release"
strip = "none"
debug = 1
# `panic` is intentionally not set: cargo ignores it for the bench profile.
