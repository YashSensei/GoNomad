[package]
name = "gonomad-proto"
description = "GoNomad wire protocol: identifiers, capabilities, frames, and the CBOR codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Flags product names ("GoNomad", "UniFFI", "SQLite") as though they were code
# items. Backticking prose nouns hurts readability more than the lint helps.
doc_markdown = "allow"
