[package]
name = "gonomad-store"
description = "GoNomad persistence: SQLite schema, migrations, and the hash-chained audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
gonomad-proto = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# Used only to assert that the public types round-trip through a human-readable
# encoding; the crate itself never serialises to JSON.
serde_json = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
