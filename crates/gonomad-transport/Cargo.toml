[package]
name = "gonomad-transport"
description = "GoNomad transport: LAN TCP and hole-punched QUIC over iroh, behind one Noise-authenticated interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
gonomad-proto = { workspace = true }
gonomad-core = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Tiers 1 and 2 of the ladder: hole-punched direct QUIC and relayed QUIC
# (ARCHITECTURE.md §4.3). This is the dependency that makes GoNomad work when
# the phone is on mobile data and the laptop is behind a home router.
iroh = { workspace = true }
# Only for `StreamExt::next` over iroh's path-event stream. Pulled in rather
# than hand-rolling a `poll_next` loop, and used nowhere else in this crate.
futures = { workspace = true }
# The pairing PSK is held in a wiping buffer for as long as a server config
# lives, which can be the whole 120-second pairing window (ARCHITECTURE.md §9).
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
